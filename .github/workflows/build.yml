name: Build My Reader APK

# Repo-র root-এ শুধু zip ফাইলটা আপলোড/commit করলেই APK বানানো শুরু হবে।
# Zip খোলা, build, sign এবং Release তৈরি — সব এই workflow-ই করে।
on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-my-reader
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract project zip
        run: |
          set -e
          BEST=""; BEST_T=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            [ -z "$T" ] && T=0
            if [ -z "$BEST" ] || [ "$T" -ge "$BEST_T" ]; then BEST="$f"; BEST_T="$T"; fi
          done
          if [ -z "$BEST" ]; then echo "::error::Repo root-e kono .zip file nai"; exit 1; fi
          echo "Using zip: $BEST"
          rm -rf _src app_build && mkdir -p _src
          unzip -q -o "$BEST" -d _src
          rm -rf _src/__MACOSX
          PKG=$(find _src -maxdepth 3 -name package.json -not -path "*/node_modules/*" | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$PKG" ]; then echo "::error::Zip-er bhitore package.json pawa jai ni"; exit 1; fi
          mv "$(dirname "$PKG")" app_build
          ls -la app_build

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        working-directory: app_build
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Set update source and build web app
        working-directory: app_build
        run: |
          echo "{ \"repo\": \"${GITHUB_REPOSITORY}\" }" > src/app-config.json
          npm run build

      - name: Add Android platform
        working-directory: app_build
        run: npx cap add android

      - name: Prepare Android project (plugin, icons, manifest, version)
        working-directory: app_build
        run: |
          VERSION_CODE=$(( $(date +%s) / 60 ))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          BUILD_NUMBER=${{ github.run_number }} VERSION_CODE=$VERSION_CODE VERSION_NAME=1.0.${{ github.run_number }} python3 scripts/prepare-android.py

      - name: Sync Capacitor
        working-directory: app_build
        run: npx cap sync android

      - name: Build release APK
        working-directory: app_build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        working-directory: app_build
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BT"
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "input apk: $IN"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks native/keystore/reader.p12 --ks-key-alias reader \
            --ks-pass pass:readerapp123 --key-pass pass:readerapp123 \
            --out "$GITHUB_WORKSPACE/MyReader.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/MyReader.apk"
          ls -la "$GITHUB_WORKSPACE/MyReader.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-APK
          path: MyReader.apk

      - name: Publish release (used by the in-app updater)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --format=%B | head -c 600)
          gh release create "build-${VERSION_CODE}" MyReader.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "My Reader ${VERSION_NAME}" \
            --notes "${NOTES:-My Reader ${VERSION_NAME}}" \
            --latest
