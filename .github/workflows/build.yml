name: Build Reader APK

on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP=$(ls -1t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip found in repo root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          PKG=$(find _src -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG" ]; then echo "package.json not found inside zip"; exit 1; fi
          mv "$(dirname "$PKG")" app_build
          ls -la app_build

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app_build
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: app_build
        env:
          VITE_BUILD: ${{ github.run_number }}
          VITE_REPO: ${{ github.repository }}
        run: npm run build

      - name: Add Android platform
        working-directory: app_build
        run: npx cap add android

      - name: Prepare Android project
        working-directory: app_build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 scripts/prepare-android.py

      - name: Sync Capacitor
        working-directory: app_build
        run: npx cap sync android

      - name: Build release APK
        working-directory: app_build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        working-directory: app_build
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks native/keystore/reader.p12 --ks-key-alias reader \
            --ks-pass pass:readerapp123 --key-pass pass:readerapp123 \
            --out "$GITHUB_WORKSPACE/Reader.apk" aligned.apk
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/Reader.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reader-APK
          path: Reader.apk

      - name: Publish release (used by in-app updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Reader v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Reader.apk
          make_latest: true
